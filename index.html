<style>
:root{
  --bg:#0C0F10; --bg-2:#131819; --surface:#161C1D; --surface-2:#1C2426; --ink:#EEF2EF; --muted:#9AA69F; --line:#2A3335;

  --warn:#F0A878; --focus:#B9E6D2; --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Calibri Light","Calibri","Carlito","Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-weight:300;font-size:19px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(60px);opacity:.9}
.aurora i{position:absolute;border-radius:50%;will-change:transform}
.aurora .a{width:55vmax;height:55vmax;left:-10vmax;top:-15vmax;background:radial-gradient(circle,var(--glow),transparent 65%);animation:driftA 28s ease-in-out infinite alternate}
.aurora .b{width:48vmax;height:48vmax;right:-14vmax;bottom:-18vmax;background:radial-gradient(circle,var(--glow-2),transparent 65%);animation:driftB 34s ease-in-out infinite alternate}
.aurora .c{width:30vmax;height:30vmax;left:40%;top:55%;background:radial-gradient(circle,rgba(143,211,182,.10),transparent 65%);animation:driftC 22s ease-in-out infinite alternate}
@keyframes driftA{to{transform:translate(18vmax,12vmax) scale(1.15)}}
@keyframes driftB{to{transform:translate(-16vmax,-10vmax) scale(1.1)}}
@keyframes driftC{to{transform:translate(-12vmax,-16vmax) scale(.9)}}
#app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;padding:14px 18px 10px;background:linear-gradient(var(--bg) 60%,transparent)}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:720px;margin:0 auto}
.brand{font-weight:400;font-size:16px;color:var(--accent);letter-spacing:.02em}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;max-width:720px;margin:10px auto 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent-2),var(--accent));box-shadow:0 0 12px var(--glow);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.langbtn{font:inherit;font-size:13px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 18px 150px}
.card{width:100%;max-width:720px}
.screen{animation:in .5s cubic-bezier(.2,.8,.2,1) both}
.screen.out{animation:out .25s ease both}
@keyframes in{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes out{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-14px)}}
.chapter{display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:400;margin-bottom:12px;padding:5px 12px;border-radius:999px;border:1px solid rgba(143,211,182,.35)}
h1,h2{font-family:inherit;text-wrap:balance;line-height:1.2;margin:0 0 12px;font-weight:400}
h1{font-size:clamp(32px,6.5vw,46px)} h2{font-size:clamp(25px,4.8vw,33px)}
.lead,.hint{color:var(--muted);font-size:16px;margin:0 0 14px} .intro p{margin:0 0 12px;font-size:19px}
.req{color:var(--muted);font-size:14px;margin-inline-start:8px}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:start;font:inherit;font-weight:300;font-size:19px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:15px 16px;cursor:pointer;transition:transform .12s ease,border-color .2s,background .2s,box-shadow .2s;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.opt:nth-child(1){animation-delay:.03s}.opt:nth-child(2){animation-delay:.06s}.opt:nth-child(3){animation-delay:.09s}.opt:nth-child(4){animation-delay:.12s}.opt:nth-child(5){animation-delay:.15s}.opt:nth-child(6){animation-delay:.18s}.opt:nth-child(7){animation-delay:.21s}.opt:nth-child(8){animation-delay:.24s}.opt:nth-child(9){animation-delay:.27s}.opt:nth-child(10){animation-delay:.30s}.opt:nth-child(11){animation-delay:.33s}.opt:nth-child(12){animation-delay:.36s}

.opt:hover{border-color:var(--accent-2);background:var(--surface-2)} .opt:active{transform:scale(.985)}
.opt .k{flex:0 0 auto;width:28px;height:28px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);transition:all .2s}
.opt[aria-checked="true"]{border-color:var(--accent);background:rgba(143,211,182,.10);box-shadow:0 0 0 1px rgba(143,211,182,.25),0 0 24px var(--glow)}
.opt[aria-checked="true"] .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
textarea,input[type=text]{width:100%;font:inherit;font-weight:300;font-size:20px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 4px;outline:none;transition:border-color .2s,box-shadow .2s;caret-color:var(--accent)}
textarea{min-height:110px;resize:vertical;line-height:1.5} textarea:focus,input:focus{border-bottom-color:var(--accent);box-shadow:0 1px 0 0 var(--accent)}

.other{margin-top:14px;font-size:17px}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 55%,transparent);z-index:6}
.foot .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.btn{font:inherit;font-weight:400;font-size:18px;border:0;border-radius:14px;padding:14px 24px;background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:52px;box-shadow:0 0 0 0 var(--glow);transition:transform .12s ease,box-shadow .3s,opacity .2s}
.btn:hover{box-shadow:0 0 28px var(--glow)} .btn:active{transform:scale(.97)} .btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;padding-inline:12px} .btn.ghost:hover{color:var(--ink);box-shadow:none}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none} .btn.alt:hover{border-color:var(--accent-2);box-shadow:none}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.spacer{flex:1} .kbd{font-size:12px;color:var(--muted);display:none} @media(min-width:760px){.kbd{display:inline}}
.msg{font-size:14px;color:var(--warn);min-height:18px;margin-top:10px} .msg.ok{color:var(--accent)}
.review{display:grid;gap:6px;margin-top:12px}
.rv{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:15px}
.rv:hover{border-color:var(--accent-2)} .rv .n{color:var(--muted);font-variant-numeric:tabular-nums} .rv .a{color:var(--ink)} .rv .a.none{color:var(--muted);font-style:italic} .rv .q{color:var(--muted);font-size:13px}
.consent{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:15px;margin:14px 0}
.check{display:flex;align-items:center;gap:12px;font-size:18px;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.done{text-align:center;padding:40px 0} .done .big{font-size:64px;line-height:1;margin-bottom:12px}
pre.out{white-space:pre-wrap;font:inherit;font-size:14px;background:var(--surface);border:1px solid var(--line);padding:12px;border-radius:12px;max-height:40vh;overflow:auto;margin-top:12px;text-align:start}
@media (prefers-reduced-motion: reduce){ .screen,.screen.out,.opt,.aurora i{animation:none} .bar i{transition:none} }
</style>

    if (id.charAt(0) === 'q') n = parseInt(id.slice(1), 10); else if (id === 'consent' || id === 'review') n = TOTAL;
    $('bar').style.width = Math.round(100 * (st.step) / (steps.length - 1)) + '%';
    $('count').textContent = n ? UI('progress').replace('{n}', n).replace('{total}', TOTAL) : '';
  }
  // ---- render ----
  var transitioning = false;
  function go(delta){ if (transitioning) return; var ns = Math.max(0, Math.min(steps.length - 1, st.step + delta)); if (ns === st.step) return; st.step = ns; save(); render(true); }
  function jump(stepId){ var i = steps.indexOf(stepId); if (i >= 0) { st.step = i; save(); render(true); } }
  function render(animate){
    var id = steps[st.step]; progress();
    var s = el('div', 'screen'); msgEl = null;
    if (id === 'welcome') renderWelcome(s);
    else if (id.indexOf('id:') === 0) { var fk = id.slice(3), fi = IDENT.findIndex(function(f){ return f.key === fk; }), fd = T().identity[fi] || IDENT[fi]; renderText(s, { title: fd.label, required: !!IDENT[fi].required, key: fk, optional: !IDENT[fi].required }); }
    else if (id.charAt(0) === 'q') renderQ(s, items[parseInt(id.slice(1), 10) - 1]);
    else if (id === 'consent') renderConsent(s);
    else if (id === 'review') renderReview(s);
    else if (id === 'done') renderDone(s);
    var old = screen; if (animate && !matchMedia('(prefers-reduced-motion: reduce)').matches) { old.classList.add('out'); transitioning = true; setTimeout(function(){ swap(); }, 180); } else swap();
    function swap(){ s.id = 'screen'; old.replaceWith(s); screen = s; transitioning = false; var f = s.querySelector('textarea, input[type=text]'); if (f && window.innerWidth > 760) f.focus(); window.scrollTo({ top: 0 }); }
    backBtn.textContent = UI('back'); backBtn.style.visibility = (st.step === 0 || id === 'done') ? 'hidden' : 'visible';
    $('kbd').textContent = (id.charAt(0) === 'q' || id.indexOf('id:') === 0) ? UI('enterHint') : '';
    if (id === 'welcome') { nextBtn.textContent = UI('start'); nextBtn.hidden = false; }
    else if (id === 'review') { nextBtn.textContent = UI('send'); nextBtn.hidden = false; }
    else if (id === 'done') { nextBtn.hidden = true; }
    else { nextBtn.textContent = UI('next'); nextBtn.hidden = false; }
  }
  function renderWelcome(s){
    var t = T(); s.appendChild(el('h1', null, t.title));
    var box = el('div', 'intro'); t.intro.forEach(function(p){ box.appendChild(el('p', null, p)); }); s.appendChild(box);
    if (resumed) {
      var card = el('div', 'consent'); var who = (st.id && st.id.name) ? ' (' + st.id.name + ')' : '';
      card.appendChild(el('div', null, UI('draftFound') + who));
      var row = el('div', 'opts'); var c1 = el('button', 'btn alt', UI('draftContinue')); c1.type = 'button'; c1.onclick = function(){ st.step = Math.max(1, st.lastStep || 1); resumed = false; save(); render(true); };
      var c2 = el('button', 'btn alt', UI('restart')); c2.type = 'button'; c2.onclick = function(){ st = { id: {}, ok: false, a: {}, step: 0 }; resumed = false; try { localStorage.removeItem(KEY); } catch (e) {} render(true); };
      row.appendChild(c1); row.appendChild(c2); card.appendChild(row); s.appendChild(card);
    }
  }
  function label(s, it, title, required, optional){
    if (it && it.qi === 0) { var sec = T().sections[it.si]; s.appendChild(el('span', 'chapter', sec.title)); }
    var h = el('h2', null, title); if (required) h.appendChild(el('span', 'req', '(' + UI('required') + ')')); s.appendChild(h);
    if (it) { var sec2 = T().sections[it.si]; if (it.qi === 0 && sec2.lead) s.appendChild(el('p', 'lead', sec2.lead)); var tq = sec2.questions[it.qi]; if (tq.hint) s.appendChild(el('p', 'hint', tq.hint)); }
  }
  function renderText(s, o){
    label(s, null, o.title, o.required, o.optional);
    var inp = el('input'); inp.type = 'text'; inp.value = (st.id && st.id[o.key]) || ''; inp.setAttribute('aria-label', o.title); inp.placeholder = UI('textPh');
    inp.addEventListener('input', function(){ st.id = st.id || {}; st.id[o.key] = inp.value; save(); }); inp.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') { ev.preventDefault(); next(); } });
    s.appendChild(inp); s.appendChild(msgEl = el('div', 'msg'));
  }
  function renderQ(s, it){
    var tq = T().sections[it.si].questions[it.qi], q = it.q;
    label(s, it, tq.text, q.required, false);
    if (q.type === 'text') {
      var ta = el(q.lines === 1 ? 'input' : 'textarea'); if (q.lines === 1) ta.type = 'text'; ta.value = ans(it.n) || ''; ta.placeholder = UI('textPh'); ta.setAttribute('aria-label', tq.text);
      ta.addEventListener('input', function(){ st.a[it.n] = ta.value; save(); });
      ta.addEventListener('keydown', function(ev){ if (ev.key === 'Enter' && (q.lines === 1 || ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); next(); } });
      s.appendChild(ta);
    } else {
      if (q.type === 'multi') s.appendChild(el('p', 'hint', UI('pickMany')));
      var cur = ans(it.n) || { i: [], other: '' }; if (!cur.i) cur.i = [];
      var wrap = el('div', 'opts'); wrap.setAttribute('role', q.type === 'multi' ? 'group' : 'radiogroup');
      tq.options.forEach(function(o, i){
        var b = el('button', 'opt'); b.type = 'button'; b.setAttribute('role', q.type === 'multi' ? 'checkbox' : 'radio'); b.setAttribute('aria-checked', cur.i.indexOf(i) >= 0 ? 'true' : 'false');
        var k = el('span', 'k', String.fromCharCode(65 + i)); b.appendChild(k); b.appendChild(el('span', null, o));
        b.addEventListener('click', function(){
          if (q.type === 'multi') { var p = cur.i.indexOf(i); if (p >= 0) cur.i.splice(p, 1); else { if (q.max && cur.i.length >= q.max) cur.i.shift(); cur.i.push(i); } b.setAttribute('aria-checked', cur.i.indexOf(i) >= 0 ? 'true' : 'false'); wrap.querySelectorAll('.opt').forEach(function(x, j){ x.setAttribute('aria-checked', cur.i.indexOf(j) >= 0 ? 'true' : 'false'); }); st.a[it.n] = cur; save(); }
          else { cur.i = [i]; st.a[it.n] = cur; save(); wrap.querySelectorAll('.opt').forEach(function(x, j){ x.setAttribute('aria-checked', j === i ? 'true' : 'false'); }); if (!(cur.other && cur.other.trim())) setTimeout(function(){ next(); }, 320); }
        });
        wrap.appendChild(b);
      });
      s.appendChild(wrap);
      if (q.other) { var ot = el('input', 'other'); ot.type = 'text'; ot.placeholder = UI('otherPh'); ot.value = cur.other || ''; ot.addEventListener('input', function(){ cur.other = ot.value; st.a[it.n] = cur; save(); }); ot.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') { ev.preventDefault(); next(); } }); s.appendChild(ot); }
    }
    s.appendChild(msgEl = el('div', 'msg'));
  }
  function renderConsent(s){
    var t = T(); s.appendChild(el('span', 'chapter', t.sections[t.sections.length - 1].title)); s.appendChild(el('h2', null, UI('consentCheck')));
    s.appendChild(el('div', 'consent', t.consent));
    var lab = el('label', 'check'); var cb = el('input'); cb.type = 'checkbox'; cb.checked = !!st.ok; cb.addEventListener('change', function(){ st.ok = cb.checked; save(); }); lab.appendChild(cb); lab.appendChild(el('span', null, UI('consentCheck'))); s.appendChild(lab);
    s.appendChild(msgEl = el('div', 'msg'));
  }
  function textOf(it){ var a = ans(it.n), tq = T().sections[it.si].questions[it.qi]; if (a == null) return ''; if (it.q.type === 'text') return String(a).trim(); var parts = (a.i || []).map(function(i){ return tq.options[i]; }); if (a.other && a.other.trim()) parts.push(UI('otherPh').split(':')[0] + ': ' + a.other.trim()); return parts.join(' | '); }
  function renderReview(s){
    s.appendChild(el('h2', null, UI('review'))); s.appendChild(el('p', 'hint', UI('reviewHint')));
    var list = el('div', 'review');
    IDENT.forEach(function(f, fi){ var r0 = el('div', 'rv'); r0.appendChild(el('span', 'n', '')); var a0 = el('div'); a0.appendChild(el('div', 'q', (T().identity[fi] || f).label)); var v0 = (st.id && st.id[f.key]) || ''; a0.appendChild(el('div', 'a' + (v0 ? '' : ' none'), v0 || UI('noAnswer'))); r0.appendChild(a0); r0.onclick = function(){ jump('id:' + f.key); }; list.appendChild(r0); });
    items.forEach(function(it){ var r = el('div', 'rv'); r.appendChild(el('span', 'n', it.n + '.')); var a = el('div'); a.appendChild(el('div', 'q', T().sections[it.si].questions[it.qi].text)); var txt = textOf(it); a.appendChild(el('div', 'a' + (txt ? '' : ' none'), txt || UI('noAnswer'))); r.appendChild(a); r.onclick = function(){ jump('q' + it.n); }; list.appendChild(r); });
    s.appendChild(list); s.appendChild(msgEl = el('div', 'msg'));
  }
  function renderDone(s){
    var d = el('div', 'done'); d.appendChild(el('div', 'big', st.sentVia === 'share' ? '📨' : '🎉'));
    if (st.sentVia === 'share') { d.appendChild(el('h2', null, UI('shareTitle'))); d.appendChild(el('p', 'hint', UI('shareBody'))); var row = el('div', 'opts'); var w = el('button', 'btn', UI('whatsapp')); w.type = 'button'; w.onclick = function(){ window.open('https://wa.me/?text=' + encodeURIComponent(compose()), '_blank'); }; var c = el('button', 'btn alt', UI('copy')); c.type = 'button'; c.onclick = function(){ navigator.clipboard.writeText(compose()).then(function(){ c.textContent = UI('copied'); }); }; row.appendChild(w); row.appendChild(c); d.appendChild(row); var pre = el('pre', 'out', compose()); d.appendChild(pre); }
    else { d.appendChild(el('h2', null, UI('sentTitle'))); d.appendChild(el('p', 'hint', UI('sentBody'))); d.appendChild(el('p', null, T().closing)); }
    s.appendChild(d);
  }
  // ---- validation + navigation ----
  function showMsg(t, ok){ if (msgEl) { msgEl.textContent = t; msgEl.className = 'msg' + (ok ? ' ok' : ''); } }
  function next(){
    var id = steps[st.step];
    if (id.indexOf('id:') === 0) { var fk2 = id.slice(3), fi2 = IDENT.findIndex(function(f){ return f.key === fk2; }); if (IDENT[fi2].required && !((st.id && st.id[fk2]) || '').trim()) { showMsg(UI('missing') + (T().identity[fi2] || IDENT[fi2]).label); return; } }
    if (id.charAt(0) === 'q') { var it = items[parseInt(id.slice(1), 10) - 1]; if (it.q.required && !answered(it)) { showMsg(UI('missing') + UI('required')); return; } }
    if (id === 'consent' && !st.ok) { showMsg(UI('missing') + UI('consentCheck')); return; }
    if (id === 'review') { submit(); return; }
    go(1);
  }
  nextBtn.addEventListener('click', next); backBtn.addEventListener('click', function(){ go(-1); });
  document.addEventListener('keydown', function(ev){ var id = steps[st.step]; if (ev.key === 'Enter' && (id === 'welcome' || id === 'consent' || id === 'review') && !ev.shiftKey) { ev.preventDefault(); next(); } if (id.charAt(0) === 'q' && /^[1-9]$/.test(ev.key) && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') { var b = screen.querySelectorAll('.opt')[parseInt(ev.key, 10) - 1]; if (b) b.click(); } });
  // ---- compose + submit ----
  function compose(){ var t = T(), L = [t.title + ' · ' + new Date().toLocaleDateString(lang === 'he' ? 'he-IL' : 'en-GB')]; IDENT.forEach(function(f, fi){ var v = (st.id && st.id[f.key]) || ''; if (v) L.push((T().identity[fi] || f).label + ': ' + v); }); items.forEach(function(it){ var x = textOf(it); if (x) L.push(it.n + ') ' + x); }); L.push(UI('consentCheck') + ': ' + (st.ok ? '✓' : '✗')); L.push('(v8 ' + lang + ')'); return L.join('\n'); }
  function finish(via){ st.sentVia = via; st.step = steps.length; steps.push('done'); try { localStorage.removeItem(KEY); } catch (e) {} render(true); }
  async function submit(){
    nextBtn.disabled = true; showMsg(UI('sending'), true);
    try {
      if (SUBMIT.mode === 'google' && SUBMIT.action) {
        var fd = new FormData();
        var E = SUBMIT.entries || {};
        IDENT.forEach(function(f){ var v = (st.id && st.id[f.key]) || ''; if (E['id_' + f.key] && v) fd.append(E['id_' + f.key], v); });
        items.forEach(function(it){ var key = E['q' + it.n]; if (!key) return; var a = ans(it.n); if (a == null) return;
          if (it.q.type === 'text') { if (String(a).trim()) fd.append(key, String(a).trim()); return; }
          var tq = LANGS.he.sections[it.si].questions[it.qi]; (a.i || []).forEach(function(i){ fd.append(key, tq.options[i]); });
          if (a.other && a.other.trim()) { fd.append(key, '__other_option__'); fd.append(key + '.other_option_response', a.other.trim()); } });
        if (E.consent) fd.append(E.consent, st.ok ? 'מאשר/ת' : '');
        if (E.lang) fd.append(E.lang, lang);
        await fetch(SUBMIT.action, { method: 'POST', mode: 'no-cors', body: fd });
        finish('google'); return;
      }
      if (SUBMIT.mode === 'formsubmit' && SUBMIT.endpoint) {
        var r = await fetch(SUBMIT.endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify({ _subject: T().title + ': ' + ((st.id && st.id.name) || ''), answers: compose() }) });
        if (!r.ok) throw new Error('http ' + r.status);
        finish('formsubmit'); return;
      }
      finish('share');
    } catch (e) { nextBtn.disabled = false; showMsg(UI('failed')); var w = el('button', 'btn alt', UI('whatsapp')); w.type = 'button'; w.onclick = function(){ finish('share'); }; msgEl.appendChild(document.createElement('br')); msgEl.appendChild(w); }
  }
  applyChrome(); render(false);
})();
</script>
