<style>
:root{
  --bg:#F2F4F0; --bg2:#E7ECE6; --surface:#FFFFFF; --ink:#1B2420; --muted:#66716B; --line:#D5DCD6;

  --bg:#141917; --bg2:#1B2320; --surface:#1F2724; --ink:#E9EEEA; --muted:#9BA69F; --line:#2F3934;
  --accent:#7FC4A8; --accent-2:#9AD4BC; --accent-ink:#0F1A15; --chip:#28322E; --chip-on:#7FC4A8; --chip-on-ink:#0F1A15;
  --soft:#1B2320; --warn:#E39A66; --focus:#A8DCC6; --shadow:0 2px 6px rgba(0,0,0,.4),0 18px 40px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#141917; --bg2:#1B2320; --surface:#1F2724; --ink:#E9EEEA; --muted:#9BA69F; --line:#2F3934;
  --accent:#7FC4A8; --accent-2:#9AD4BC; --accent-ink:#0F1A15; --chip:#28322E; --chip-on:#7FC4A8; --chip-on-ink:#0F1A15;
  --soft:#1B2320; --warn:#E39A66; --focus:#A8DCC6; --shadow:0 2px 6px rgba(0,0,0,.4),0 18px 40px rgba(0,0,0,.4);
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,var(--bg2),transparent 60%),var(--bg);color:var(--ink);font-family:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;padding:12px 18px 8px;background:linear-gradient(var(--bg) 70%,transparent)}

.brand{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:700;font-size:17px;color:var(--accent)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;max-width:720px;margin:8px auto 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .35s ease}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.card{width:100%;max-width:720px}
.screen{animation:in .32s ease both}

.chapter{display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:10px;padding:4px 10px;border-radius:999px;background:var(--chip)}
h1,h2{font-family:"Frank Ruhl Libre",Georgia,"Times New Roman",serif;text-wrap:balance;line-height:1.18;margin:0 0 10px}
h1{font-size:clamp(30px,6vw,44px);font-weight:900} h2{font-size:clamp(24px,4.6vw,32px);font-weight:700}

.req{color:var(--muted);font-size:14px;font-weight:400;margin-inline-start:6px}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:start;font:inherit;font-size:18px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:transform .08s ease,border-color .15s,background .15s}
.opt:hover{border-color:var(--accent-2)} .opt:active{transform:scale(.99)}
.opt .k{flex:0 0 auto;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--soft)} .opt[aria-checked="true"] .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
textarea,input[type=text]{width:100%;font:inherit;font-size:19px;color:var(--ink);background:var(--surface);border:0;border-bottom:2px solid var(--line);padding:12px 4px;outline:none;transition:border-color .15s}
textarea{min-height:110px;resize:vertical;line-height:1.5} textarea:focus,input:focus{border-bottom-color:var(--accent)}
.other{margin-top:4px;font-size:17px}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 60%,transparent);z-index:6}
.foot .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.btn{font:inherit;font-weight:800;font-size:18px;border:0;border-radius:14px;padding:14px 22px;background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:52px;box-shadow:var(--shadow);transition:transform .08s ease,opacity .15s}

.btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.spacer{flex:1} .kbd{font-size:12px;color:var(--muted);display:none} @media(min-width:760px){.kbd{display:inline}}
.msg{font-size:14px;color:var(--warn);min-height:18px;margin-top:10px} .msg.ok{color:var(--accent)}
.review{display:grid;gap:6px;margin-top:12px}
.rv{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:15px}
.rv .n{color:var(--muted);font-variant-numeric:tabular-nums} .rv .a{color:var(--ink)} .rv .a.none{color:var(--muted);font-style:italic} .rv .q{color:var(--muted);font-size:13px}
.consent{background:var(--soft);border-radius:14px;padding:14px;font-size:15px;margin:14px 0}
.check{display:flex;align-items:center;gap:12px;font-size:18px;cursor:pointer;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.done{text-align:center;padding:40px 0} .done .big{font-size:64px;line-height:1;margin-bottom:12px}
pre.out{white-space:pre-wrap;font:inherit;font-size:14px;background:var(--surface);border:1px solid var(--line);padding:12px;border-radius:12px;max-height:40vh;overflow:auto;margin-top:12px}
.resume{font-size:14px;color:var(--muted);margin-top:10px} .resume button{font:inherit;font-size:14px;background:none;border:0;color:var(--accent);cursor:pointer;text-decoration:underline}
@media (prefers-reduced-motion: reduce){ .screen,.screen.out{animation:none} .bar i{transition:none} }
</style>
</head>

  function next(){
    var id = steps[st.step];
    if (id.indexOf('id:') === 0) { var fk2 = id.slice(3), fi2 = IDENT.findIndex(function(f){ return f.key === fk2; }); if (IDENT[fi2].required && !((st.id && st.id[fk2]) || '').trim()) { showMsg(UI('missing') + (T().identity[fi2] || IDENT[fi2]).label); return; } }
    if (id.charAt(0) === 'q') { var it = items[parseInt(id.slice(1), 10) - 1]; if (it.q.required && !answered(it)) { showMsg(UI('missing') + UI('required')); return; } }
    if (id === 'consent' && !st.ok) { showMsg(UI('missing') + UI('consentCheck')); return; }
    if (id === 'review') { submit(); return; }
    go(1);
  }
  nextBtn.addEventListener('click', next); backBtn.addEventListener('click', function(){ go(-1); });
  document.addEventListener('keydown', function(ev){ var id = steps[st.step]; if (ev.key === 'Enter' && (id === 'welcome' || id === 'consent' || id === 'review') && !ev.shiftKey) { ev.preventDefault(); next(); } if (id.charAt(0) === 'q' && /^[1-9]$/.test(ev.key) && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') { var b = screen.querySelectorAll('.opt')[parseInt(ev.key, 10) - 1]; if (b) b.click(); } });
  // ---- compose + submit ----
  function compose(){ var t = T(), L = [t.title + ' · ' + new Date().toLocaleDateString(lang === 'he' ? 'he-IL' : 'en-GB')]; IDENT.forEach(function(f, fi){ var v = (st.id && st.id[f.key]) || ''; if (v) L.push((T().identity[fi] || f).label + ': ' + v); }); items.forEach(function(it){ var x = textOf(it); if (x) L.push(it.n + ') ' + x); }); L.push(UI('consentCheck') + ': ' + (st.ok ? '✓' : '✗')); L.push('(v7 ' + lang + ')'); return L.join('\n'); }
  function finish(via){ st.sentVia = via; st.step = steps.length; steps.push('done'); save(); render(true); }
  async function submit(){
    nextBtn.disabled = true; showMsg(UI('sending'), true);
    try {
      if (SUBMIT.mode === 'google' && SUBMIT.action) {
        var fd = new FormData();
        var E = SUBMIT.entries || {};
        IDENT.forEach(function(f){ var v = (st.id && st.id[f.key]) || ''; if (E['id_' + f.key] && v) fd.append(E['id_' + f.key], v); });
        items.forEach(function(it){ var key = E['q' + it.n]; if (!key) return; var a = ans(it.n); if (a == null) return;
          if (it.q.type === 'text') { if (String(a).trim()) fd.append(key, String(a).trim()); return; }
          var tq = LANGS.he.sections[it.si].questions[it.qi]; (a.i || []).forEach(function(i){ fd.append(key, tq.options[i]); });
          if (a.other && a.other.trim()) { fd.append(key, '__other_option__'); fd.append(key + '.other_option_response', a.other.trim()); } });
        if (E.consent) fd.append(E.consent, st.ok ? 'מאשר/ת' : '');
        if (E.lang) fd.append(E.lang, lang);
        await fetch(SUBMIT.action, { method: 'POST', mode: 'no-cors', body: fd });
        finish('google'); return;
      }
      if (SUBMIT.mode === 'formsubmit' && SUBMIT.endpoint) {
        var r = await fetch(SUBMIT.endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify({ _subject: T().title + ': ' + ((st.id && st.id.name) || ''), answers: compose() }) });
        if (!r.ok) throw new Error('http ' + r.status);
        finish('formsubmit'); return;
      }
      finish('share');
    } catch (e) { nextBtn.disabled = false; showMsg(UI('failed')); var w = el('button', 'btn alt', UI('whatsapp')); w.type = 'button'; w.onclick = function(){ finish('share'); }; msgEl.appendChild(document.createElement('br')); msgEl.appendChild(w); }
  }
  applyChrome(); render(false);
})();
</script>
