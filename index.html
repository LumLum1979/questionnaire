:root{

.brand{font-weight:400;font-size:16px;color:var(--accent);letter-spacing:.02em}

.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 18px 150px}
.card{width:100%;max-width:720px}
.screen{animation:in .5s cubic-bezier(.2,.8,.2,1) both}
.screen.out{animation:out .25s ease both}
@keyframes in{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

e purpose of monitoring progress and improving the training. The recordings are not published or shared with others", "questions": [{"text": "Photo and recording consent", "hint": "", "options": ["I approve video and audio recording", "I approve audio recording only", "I do not approve recording"]}]}]}}, "submit": {"mode": "share"}}</script>
<script>
(function(){
  var D = JSON.parse(document.getElementById('Q').textContent), S = D.structure, LANGS = D.lang, SUBMIT = D.submit || { mode: 'share' };
  var KEY = 'intake-sections-v9', lang = 'he';
  try { var sl = localStorage.getItem(KEY + ':lang'); if (sl && LANGS[sl]) lang = sl; } catch (e) {}
  var T = function(){ return LANGS[lang]; }, UI = function(k){ return T().ui[k] || ''; };
  var IDENT = S.identity;
  // flat question list (n = running number used for the message/import), per-section lists
  var items = [], secItems = [];
  S.sections.forEach(function(sec, si){ secItems[si] = []; sec.questions.forEach(function(q, qi){ var it = { si: si, qi: qi, n: items.length + 1, q: q }; items.push(it); secItems[si].push(it); }); });
  var numbered = []; S.sections.forEach(function(sec, si){ if (!sec.consent) numbered.push(si); });
  var consentSi = S.sections.findIndex(function(sec){ return sec.consent; });
  var TOTAL = numbered.length;
  var steps = ['welcome', 'ident'].concat(numbered.map(function(si){ return 's' + si; })).concat(['consent', 'review']);
  var st = { id: {}, ok: false, a: {}, step: 0 };
  try { var saved = JSON.parse(localStorage.getItem(KEY) || 'null'); if (saved && saved.a) { st = saved; st.lastStep = Math.min(st.lastStep || saved.step || 0, steps.length - 1); st.step = 0; } } catch (e) {}
  var resumed = (st.lastStep || 0) > 0 || Object.keys(st.a || {}).length > 0 || !!(st.id && st.id.name);
  function save(){ try { st.lastStep = st.step; localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  var $ = function(id){ return document.getElementById(id); };
  var screen = $('screen'), nextBtn = $('next'), backBtn = $('back'), msgEl = null;
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function applyChrome(){
    var t = T(); document.documentElement.setAttribute('dir', t.dir); document.documentElement.setAttribute('lang', lang); document.title = t.title; $('brand').textContent = t.title;
    var lb = $('langbtn'); if (LANGS.en) { lb.hidden = false; lb.textContent = lang === 'he' ? 'English' : 'עברית'; }
  }
  if (LANGS.en) $('langbtn').addEventListener('click', function(){ lang = lang === 'he' ? 'en' : 'he'; try { localStorage.setItem(KEY + ':lang', lang); } catch (e) {} applyChrome(); render(false); });
  function ans(n){ return st.a[n]; }
  function answered(it){ var a = ans(it.n); if (a == null) return false; if (it.q.type === 'text') return !!String(a).trim(); return !!((a.i && a.i.length) || (a.other && a.other.trim())); }
  function progress(){
    var id = steps[st.step], n = 0;
    if (id.charAt(0) === 's') n = numbered.indexOf(parseInt(id.slice(1), 10)) + 1; else if (id === 'consent' || id === 'review') n = TOTAL;
    $('bar').style.width = Math.round(100 * st.step / (steps.length - 1)) + '%';
    $('count').textContent = n ? UI('progress').replace('{n}', n).replace('{total}', TOTAL) : '';
  }
  var transitioning = false;
  function go(delta){ if (transitioning) return; var ns = Math.max(0, Math.min(steps.length - 1, st.step + delta)); if (ns === st.step) return; st.step = ns; save(); render(true); }
  function jump(stepId){ var i = steps.indexOf(stepId); if (i >= 0) { st.step = i; save(); render(true); } }
  function render(animate){
    var id = steps[st.step]; progress();
    var s = el('div', 'screen'); msgEl = null;
    if (id === 'welcome') renderWelcome(s);
    else if (id === 'ident') renderIdent(s);
    else if (id.charAt(0) === 's') renderSection(s, parseInt(id.slice(1), 10));
    else if (id === 'consent') renderConsent(s);
    else if (id === 'review') renderReview(s);
    else if (id === 'done') renderDone(s);
    var old = screen; if (animate && !matchMedia('(prefers-reduced-motion: reduce)').matches) { old.classList.add('out'); transitioning = true; setTimeout(swap, 180); } else swap();
    function swap(){ s.id = 'screen'; old.replaceWith(s); screen = s; transitioning = false; var f = s.querySelector('textarea, input[type=text]'); if (f && window.innerWidth > 760) f.focus(); window.scrollTo({ top: 0 }); }
    backBtn.textContent = UI('back'); backBtn.style.visibility = (st.step === 0 || id === 'done') ? 'hidden' : 'visible';
    $('kbd').textContent = '';
    if (id === 'welcome') { nextBtn.textContent = UI('start'); nextBtn.hidden = false; }
    else if (id === 'review') { nextBtn.textContent = UI('send'); nextBtn.hidden = false; }
    else if (id === 'done') { nextBtn.hidden = true; }
    else { nextBtn.textContent = UI('next'); nextBtn.hidden = false; }
  }
  function renderWelcome(s){
    var t = T(); s.appendChild(el('h1', null, t.title));
    var box = el('div', 'intro'); t.intro.forEach(function(p){ box.appendChild(el('p', null, p)); }); s.appendChild(box);
    if (resumed) {
      var card = el('div', 'consent'); var who = (st.id && st.id.name) ? ' (' + st.id.name + ')' : '';
      card.appendChild(el('div', null, UI('draftFound') + who));
      var row = el('div', 'opts'); var c1 = el('button', 'btn alt', UI('draftContinue')); c1.type = 'button'; c1.onclick = function(){ st.step = Math.max(1, st.lastStep || 1); resumed = false; save(); render(true); };
      var c2 = el('button', 'btn alt', UI('restart')); c2.type = 'button'; c2.onclick = function(){ st = { id: {}, ok: false, a: {}, step: 0 }; resumed = false; try { localStorage.removeItem(KEY); } catch (e) {} render(true); };
      row.appendChild(c1); row.appendChild(c2); card.appendChild(row); s.appendChild(card);
    }
  }
  function textInput(single, value, placeholder, onInput, onEnter){
    var inp = el(single ? 'input' : 'textarea'); if (single) inp.type = 'text'; inp.value = value || ''; inp.placeholder = placeholder;
    inp.addEventListener('input', function(){ onInput(inp.value); });
    inp.addEventListener('keydown', function(ev){ if (ev.key === 'Enter' && (single || ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); onEnter(); } });
    return inp;
  }
  function renderIdent(s){
    s.appendChild(el('h2', null, UI('details'))); var box = el('div', 'ident');
    IDENT.forEach(function(f, fi){
      var fd = T().identity[fi] || f; var w = el('div', 'field'); var lab = el('label', null, fd.label); if (f.required) lab.appendChild(el('span', 'req', '(' + UI('required') + ')')); w.appendChild(lab);
      w.appendChild(textInput(true, (st.id && st.id[f.key]) || '', UI('textPh'), function(v){ st.id = st.id || {}; st.id[f.key] = v; save(); }, next)); box.appendChild(w);
    });
    s.appendChild(box); s.appendChild(msgEl = el('div', 'msg'));
  }
  function qBlock(container, it, isFirst){
    var tq = T().sections[it.si].questions[it.qi], q = it.q;
    var b = el('div', 'qblock'); var h = el(isFirst ? 'h2' : 'h3', null, tq.text); if (q.required) h.appendChild(el('span', 'req', '(' + UI('required') + ')')); b.appendChild(h);
    if (tq.hint) b.appendChild(el('p', 'hint', tq.hint));
    if (q.type === 'text') {
      b.appendChild(textInput(q.lines === 1, ans(it.n) || '', UI('textPh'), function(v){ st.a[it.n] = v; save(); }, next));
    } else {
      var cur = ans(it.n) || { i: [], other: '' }; if (!cur.i) cur.i = [];
      var wrap = el('div', 'opts'); wrap.setAttribute('role', q.type === 'multi' ? 'group' : 'radiogroup');
      tq.options.forEach(function(o, i){
        var btn = el('button', 'opt'); btn.type = 'button'; btn.setAttribute('role', q.type === 'multi' ? 'checkbox' : 'radio'); btn.setAttribute('aria-checked', cur.i.indexOf(i) >= 0 ? 'true' : 'false');
        btn.appendChild(el('span', 'k', String.fromCharCode(65 + i))); btn.appendChild(el('span', null, o));
        btn.addEventListener('click', function(){
          if (q.type === 'multi') { var p = cur.i.indexOf(i); if (p >= 0) cur.i.splice(p, 1); else { if (q.max && cur.i.length >= q.max) cur.i.shift(); cur.i.push(i); } }
          else cur.i = [i];
          st.a[it.n] = cur; save(); wrap.querySelectorAll('.opt').forEach(function(x, j){ x.setAttribute('aria-checked', cur.i.indexOf(j) >= 0 ? 'true' : 'false'); });
        });
        wrap.appendChild(btn);
      });
      b.appendChild(wrap);
      if (q.other) { var ot = el('input', 'other'); ot.type = 'text'; ot.placeholder = UI('otherPh'); ot.value = cur.other || ''; ot.addEventListener('input', function(){ cur.other = ot.value; st.a[it.n] = cur; save(); }); ot.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') { ev.preventDefault(); next(); } }); b.appendChild(ot); }
    }
    container.appendChild(b);
  }
  function renderSection(s, si){
    var sec = T().sections[si]; if (!S.sections[si].numbered && sec.title) s.appendChild(el('span', 'chapter', sec.title));
    if (sec.lead) s.appendChild(el('p', 'lead', sec.lead));
    secItems[si].forEach(function(it, k){ qBlock(s, it, k === 0); });
    s.appendChild(msgEl = el('div', 'msg'));
  }
  function renderConsent(s){
    var t = T(); var sec = consentSi >= 0 ? t.sections[consentSi] : null;
    s.appendChild(el('h2', null, UI('consentTitle')));
    if (sec && sec.lead) s.appendChild(el('p', 'lead', sec.lead + '.'));
    if (consentSi >= 0) secItems[consentSi].forEach(function(it){ var tq = t.sections[it.si].questions[it.qi]; var cur = ans(it.n) || { i: [], other: '' }; var wrap = el('div', 'opts'); wrap.setAttribute('role', 'radiogroup');
      tq.options.forEach(function(o, i){ var btn = el('button', 'opt'); btn.type = 'button'; btn.setAttribute('role', 'radio'); btn.setAttribute('aria-checked', (cur.i || []).indexOf(i) >= 0 ? 'true' : 'false'); btn.appendChild(el('span', 'k', String.fromCharCode(65 + i))); btn.appendChild(el('span', null, o));
        btn.addEventListener('click', function(){ cur.i = [i]; st.a[it.n] = cur; save(); wrap.querySelectorAll('.opt').forEach(function(x, j){ x.setAttribute('aria-checked', j === i ? 'true' : 'false'); }); }); wrap.appendChild(btn); });
      s.appendChild(wrap); });
    var lab = el('label', 'check'); var cb = el('input'); cb.type = 'checkbox'; cb.checked = !!st.ok; cb.addEventListener('change', function(){ st.ok = cb.checked; save(); }); lab.appendChild(cb); lab.appendChild(el('span', null, UI('consentCheck'))); lab.style.marginTop = '14px'; s.appendChild(lab);
    s.appendChild(msgEl = el('div', 'msg'));
  }
  function textOf(it){ var a = ans(it.n), tq = T().sections[it.si].questions[it.qi]; if (a == null) return ''; if (it.q.type === 'text') return String(a).trim(); var parts = (a.i || []).map(function(i){ return tq.options[i]; }); if (a.other && a.other.trim()) parts.push(a.other.trim()); return parts.join(' | '); }
  function stepOf(it){ return S.sections[it.si].consent ? 'consent' : 's' + it.si; }
  function renderReview(s){
    s.appendChild(el('h2', null, UI('review'))); s.appendChild(el('p', 'hint', UI('reviewHint')));
    var list = el('div', 'review');
    IDENT.forEach(function(f, fi){ var r0 = el('div', 'rv'); r0.appendChild(el('span', 'n', '')); var a0 = el('div'); a0.appendChild(el('div', 'q', (T().identity[fi] || f).label)); var v0 = (st.id && st.id[f.key]) || ''; a0.appendChild(el('div', 'a' + (v0 ? '' : ' none'), v0 || UI('noAnswer'))); r0.appendChild(a0); r0.onclick = function(){ jump('ident'); }; list.appendChild(r0); });
    items.forEach(function(it){ var r = el('div', 'rv'); var num = S.sections[it.si].numbered && it.qi === 0 ? T().sections[it.si].title + '.' : ''; r.appendChild(el('span', 'n', num)); var a = el('div'); a.appendChild(el('div', 'q', T().sections[it.si].questions[it.qi].text)); var txt = textOf(it); a.appendChild(el('div', 'a' + (txt ? '' : ' none'), txt || UI('noAnswer'))); r.appendChild(a); r.onclick = function(){ jump(stepOf(it)); }; list.appendChild(r); });
    s.appendChild(list); s.appendChild(msgEl = el('div', 'msg'));
  }
  function renderDone(s){
    var d = el('div', 'done'); d.appendChild(el('div', 'big', st.sentVia === 'share' ? '📨' : '🎉'));
    if (st.sentVia === 'share') { d.appendChild(el('h2', null, UI('shareTitle'))); d.appendChild(el('p', 'hint', UI('shareBody'))); var row = el('div', 'opts'); var w = el('button', 'btn', UI('whatsapp')); w.type = 'button'; w.onclick = function(){ window.open('https://wa.me/?text=' + encodeURIComponent(compose()), '_blank'); }; var c = el('button', 'btn alt', UI('copy')); c.type = 'button'; c.onclick = function(){ navigator.clipboard.writeText(compose()).then(function(){ c.textContent = UI('copied'); }); }; row.appendChild(w); row.appendChild(c); d.appendChild(row); d.appendChild(el('pre', 'out', compose())); }
    else { d.appendChild(el('h2', null, UI('sentTitle'))); d.appendChild(el('p', 'hint', UI('sentBody'))); d.appendChild(el('p', null, T().closing)); }
    s.appendChild(d);
  }
  function showMsg(t, ok){ if (msgEl) { msgEl.textContent = t; msgEl.className = 'msg' + (ok ? ' ok' : ''); } }
  function next(){
    var id = steps[st.step];
    if (id === 'ident') { for (var k = 0; k < IDENT.length; k++) { if (IDENT[k].required && !((st.id && st.id[IDENT[k].key]) || '').trim()) { showMsg(UI('missing') + (T().identity[k] || IDENT[k]).label); return; } } }
    if (id.charAt(0) === 's') { var si = parseInt(id.slice(1), 10); for (var j = 0; j < secItems[si].length; j++) { var it = secItems[si][j]; if (it.q.required && !answered(it)) { showMsg(UI('missing') + T().sections[si].questions[it.qi].text); return; } } }
    if (id === 'consent') { if (consentSi >= 0) { var cit = secItems[consentSi][0]; if (cit && cit.q.required && !answered(cit)) { showMsg(UI('missing') + UI('consentTitle')); return; } } if (!st.ok) { showMsg(UI('missing') + UI('consentCheck')); return; } }
    if (id === 'review') { submit(); return; }
    go(1);
  }
  nextBtn.addEventListener('click', next); backBtn.addEventListener('click', function(){ go(-1); });
  document.addEventListener('keydown', function(ev){ var id = steps[st.step]; if (ev.key === 'Enter' && (id === 'welcome' || id === 'review') && !ev.shiftKey) { ev.preventDefault(); next(); } });
  function compose(){ var t = T(), L = [t.title + ' · ' + new Date().toLocaleDateString(lang === 'he' ? 'he-IL' : 'en-GB')]; IDENT.forEach(function(f, fi){ var v = (st.id && st.id[f.key]) || ''; if (v) L.push((T().identity[fi] || f).label + ': ' + v); }); items.forEach(function(it){ var x = textOf(it); if (x) L.push(it.n + ') ' + x); }); L.push(UI('consentCheck') + ': ' + (st.ok ? '✓' : '✗')); L.push('(v9 ' + lang + ')'); return L.join('\n'); }
  function finish(via){ st.sentVia = via; st.step = steps.length; steps.push('done'); try { localStorage.removeItem(KEY); } catch (e) {} render(true); }
  async function submit(){
    nextBtn.disabled = true; showMsg(UI('sending'), true);
    try {
      if (SUBMIT.mode === 'formsubmit' && SUBMIT.endpoint) { var r = await fetch(SUBMIT.endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify({ _subject: T().title + ': ' + ((st.id && st.id.name) || ''), answers: compose() }) }); if (!r.ok) throw new Error('http ' + r.status); finish('formsubmit'); return; }
      finish('share');
    } catch (e) { nextBtn.disabled = false; showMsg(UI('failed')); var w = el('button', 'btn alt', UI('whatsapp')); w.type = 'button'; w.onclick = function(){ finish('share'); }; msgEl.appendChild(document.createElement('br')); msgEl.appendChild(w); }
  }
  applyChrome(); render(false);
})();
</script>
